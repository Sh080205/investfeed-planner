<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InvestFeed — ข่าวการลงทุน</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">
      <span class="logo-mark" aria-hidden="true">📈</span>
      <span class="logo-name">InvestFeed</span>
    </div>

    <nav class="tab-bar" id="tab-bar">
      <button class="tab active" data-cat="all">ทั้งหมด</button>
      <button class="tab" data-cat="thai">
        <span class="dot" style="--c:var(--cat-thai)"></span>หุ้นไทย
      </button>
      <button class="tab" data-cat="international">
        <span class="dot" style="--c:var(--cat-intl)"></span>ต่างประเทศ
      </button>
      <button class="tab" data-cat="tech">
        <span class="dot" style="--c:var(--cat-tech)"></span>เทคโนโลยี
      </button>
      <button class="tab" data-cat="funds">
        <span class="dot" style="--c:var(--cat-funds)"></span>กองทุน
      </button>
      <button class="tab" data-cat="bonds">
        <span class="dot" style="--c:var(--cat-bonds)"></span>พันธบัตร
      </button>
      <button class="tab" data-cat="crypto">
        <span class="dot" style="--c:var(--cat-crypto)"></span>คริปโต
      </button>
      <button class="tab" data-cat="bookmarks" id="bm-tab">
        บุ๊กมาร์ก<span class="tab-count" id="bm-count">0</span>
      </button>
    </nav>

    <div class="header-tools">
      <label class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="14" height="14">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="search" id="search-input" class="search-input" placeholder="ค้นหาข่าว..." autocomplete="off">
      </label>
      <button class="ai-btn" id="ai-btn" title="สรุปข่าวด้วย AI">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
          <path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3z"/>
        </svg>
        <span>สรุปข่าว AI</span>
      </button>
      <button class="tool-btn" id="ai-history-btn" title="ประวัติสรุปย้อนหลัง">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
          <path d="M3 3v5h5"/>
          <path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/>
          <path d="M12 7v5l4 2"/>
        </svg>
      </button>
      <button class="tool-btn" id="refresh-btn" title="รีเฟรชข่าว">
        <svg id="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
          <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </button>
      <a class="tool-btn" href="/planner" title="เปิด Planner (แผน ICPC + ตารางเรียน)" style="text-decoration:none">📅</a>
      <button class="tool-btn" id="theme-btn" title="สลับ Dark / Light">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main class="main">
  <p class="stats-bar" id="stats-bar">กำลังโหลด...</p>

  <section class="ai-panel hidden" id="ai-panel">
    <div class="ai-panel-head">
      <div class="ai-panel-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3z"/>
        </svg>
        <span>สรุปข่าว AI</span>
        <span class="ai-meta" id="ai-meta"></span>
      </div>
      <button class="ai-close" id="ai-close" title="ปิด" aria-label="ปิด">✕</button>
    </div>
    <div class="ai-panel-body" id="ai-panel-body"></div>
  </section>

  <div class="news-grid" id="news-grid"></div>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    <span>กำลังดึงข่าว...</span>
  </div>

  <div class="empty hidden" id="empty">
    <p class="empty-icon">🔍</p>
    <p id="empty-msg">ไม่พบข่าวที่ค้นหา</p>
  </div>

  <nav class="pagination" id="pagination"></nav>
</main>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
